<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keep × Meta AI lockup</title>
<style>
/* Lockup motion: Keep's flower rises out of a blur, the wordmark follows, then "× Meta AI" settles beside it. Black stage like a co-brand end card. */
:root{--stage:#000;--ink:#FFFFFF;--soft:rgba(255,255,255,.55);--s1:#8FA6F5;--s2:#C4B5F7;--s3:#F4B3C8;
  --face:'Inter Display','SF Pro Display',-apple-system,'Segoe UI',system-ui,sans-serif}
html,body{margin:0;height:100%;background:var(--stage)}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:var(--stage)}
.frame{position:relative;width:1920px;height:1080px;display:grid;place-items:center;transform-origin:center}
.group{display:flex;align-items:center;gap:34px;will-change:transform}
.icon{position:relative;width:132px;height:132px;flex:none}
.glow{position:absolute;inset:-70px;border-radius:50%;background:radial-gradient(closest-side,rgba(196,181,247,.55),rgba(244,179,200,.22) 55%,transparent);pointer-events:none}
.tile{position:absolute;inset:0;border-radius:50%;overflow:hidden;isolation:isolate;background:radial-gradient(70% 70% at 25% 20%,var(--s1),transparent 70%),radial-gradient(80% 80% at 85% 90%,var(--s3),transparent 70%),var(--s2);display:grid;place-items:center}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 32% 24%,rgba(255,255,255,.45),transparent 60%);z-index:-1}
.tile svg{width:78px;height:78px;color:#fff;filter:drop-shadow(0 2px 6px rgba(40,30,90,.25))}
.word{font:600 104px/1 var(--face);letter-spacing:-.035em;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:30px}
.x{font-weight:300;color:var(--soft);font-size:84px;display:inline-block}
.meta{display:inline-flex;font-weight:500}
.meta span{display:inline-block;white-space:pre}
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font:13px/1 var(--face);color:rgba(255,255,255,.35);letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){.hint{display:none}}
</style></head>

    <div class="word"><span id="keep">Keep</span><span class="x" id="x">×</span><span class="meta" id="meta"></span></div>

</div></div>
<div class="hint" id="hint">Click to replay</div>
<script>
/* Timeline in seconds. render(t) is pure, so the page can play live or be stepped frame by frame for export. */
const DUR=5;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const outExpo=k=>k>=1?1:1-Math.pow(2,-10*k);
const outCubic=k=>1-Math.pow(1-k,3);
const inOutCubic=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const outBack=k=>{const c=1.4;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2)};
'Meta AI'.split('').forEach(ch=>{const s=document.createElement('span');s.textContent=ch;$('meta').appendChild(s)});
const letters=[...$('meta').children];
/* where the icon sits once the whole lockup is laid out, so the opening can start with the icon alone at centre */
let startShift=0;
function measure(){const g=$('group'),keep=g.style.transform;g.style.transform='none';const f=$('frame').getBoundingClientRect(),i=$('icon').getBoundingClientRect(),s=f.width/1920||1;startShift=((f.left+f.width/2)-(i.left+i.width/2))/s;g.style.transform=keep}
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);$('frame').style.transform='scale('+k+')';measure()}
function render(t){
  /* icon: rises, un-blurs and unfurls (0.2s to 1.3s) */
  const a=outExpo(seg(t,.2,1.3));
  $('icon').style.opacity=seg(t,.2,.7);
  $('icon').style.transform='translateY('+(36*(1-a))+'px) scale('+(.7+.3*a)+')';
  $('icon').style.filter='blur('+(18*(1-a))+'px)';
  $('flower').style.transform='rotate('+(-40*(1-a))+'deg) scale('+(.85+.15*a)+')';
  /* glow blooms with the icon, then settles low */
  const g=seg(t,.3,1.1),g2=seg(t,1.1,2.4);
  $('glow').style.opacity=(.9*outCubic(g)*(1-.7*inOutCubic(g2))).toFixed(3);
  $('glow').style.transform='scale('+(.6+.5*outCubic(g))+')';
  /* lockup slides from icon-centred to text-centred while the wordmark arrives (1.2s to 2.1s) */
  const m=inOutCubic(seg(t,1.2,2.1));
  $('group').style.transform='translateX('+(startShift*(1-m))+'px)';
  const w=outExpo(seg(t,1.35,2.15));
  $('keep').style.opacity=seg(t,1.35,1.8);$('keep').style.transform='translateX('+(-22*(1-w))+'px)';$('keep').style.filter='blur('+(10*(1-w))+'px)';
  /* × turns into place (2.05s to 2.5s) */
  const xk=seg(t,2.05,2.5);
  $('x').style.opacity=xk;$('x').style.transform='rotate('+(90*(1-outBack(xk)))+'deg) scale('+(.5+.5*outBack(xk))+')';
  /* Meta AI, letter by letter (2.25s on, 45ms apart) */
  letters.forEach((el,i)=>{const k=outExpo(seg(t,2.25+i*.045,2.85+i*.045));el.style.opacity=clamp(k*1.4);el.style.transform='translateY('+(22*(1-k))+'px)';el.style.filter='blur('+(8*(1-k))+'px)'});
}
let t0=null,raf=0;
function play(){cancelAnimationFrame(raf);t0=null;const step=ts=>{if(t0===null)t0=ts;const t=(ts-t0)/1000;render(Math.min(t,DUR));if(t<DUR)raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
addEventListener('resize',()=>{fit();});
addEventListener('click',play);
document.fonts.ready.then(()=>{fit();if(matchMedia('(prefers-reduced-motion: reduce)').matches)render(DUR);else if(!window.__EXPORT__)play();else render(0)});
window.render=render;window.fit=fit;
</script>
